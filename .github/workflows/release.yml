name: release

# Runs only on version tags. No path filter here, so a release tag ALWAYS
# builds and publishes, even if the tagged commit only touched docs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies
        run: npm install --no-package-lock

      - name: Syntax / transpile check (esbuild)
        run: npm run check

      - name: Package addon tarball
        id: pack
        run: |
          FILE=$(npm pack | tail -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Packed: $FILE"

      - name: Attach tarball to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.file }}
          generate_release_notes: true
